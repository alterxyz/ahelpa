name: release

# Build the ahelpa runtime for every supported platform and attach the
# tarballs to the GitHub Release for the pushed tag. install.sh resolves the
# asset name per OS/arch (darwin-arm64 / darwin-x64 / linux-x64 / linux-arm64),
# so the runtime is installable on macOS and Linux alike.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          - { os: macos-13, platform: darwin-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
          # linux-arm64 uses GitHub's hosted arm64 Linux runner. If it is not
          # available on this account/repo, drop this matrix entry.
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: compile runtime
        run: |
          bun build src/cli.ts --compile --outfile=dist/ahelpa
          rm -f .*.bun-build

      - name: package tarball
        run: tar czf "ahelpa-${{ matrix.platform }}.tar.gz" -C dist ahelpa

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "ahelpa-${{ matrix.platform }}.tar.gz" --clobber
